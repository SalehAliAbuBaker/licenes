<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وربط تراخيص «راتب» للأجهزة المتعددة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 sm:p-6">

    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-2xl p-6">
        <header class="border-b pb-4 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-700">إدارة وتوزيع تراخيص «راتب» للأجهزة</h1>
                <p class="text-sm text-gray-500 mt-1">إضافة الأكواد الرئيسية وتتبع توزيعها على المستخدمين والأجهزة بكل سهولة.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">تصدير البيانات</button>
                <label class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition">
                    استيراد
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </header>

        <!-- نموذج إضافة كود رئيسي جديد -->
        <form id="licenseForm" onsubmit="saveMainLicense(event)" class="bg-emerald-50/60 border border-emerald-100 rounded-xl p-4 mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">الكود / مفتاح الترخيص الرئيسي</label>
                <input type="text" id="mainKey" required placeholder="مثال: RT-500-XYZ" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">الحد الأقصى للأجهزة المسموحة</label>
                <input type="number" id="maxDevices" required min="1" value="1" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">المدة أو الملاحظات</label>
                <input type="text" id="note" placeholder="مثال: سنوي / مؤسسة كذا" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div class="sm:col-span-3 flex justify-end">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-xl text-sm transition">حفظ الكود في القائمة</button>
            </div>
        </form>

        <!-- بحث -->
        <div class="mb-6">
            <input type="text" id="searchInput" oninput="renderApp()" placeholder="ابحث برقم الكود أو اسم المستفيد أو الجهاز..." class="w-full border rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <!-- قائمة الأكواد وتوزيعاتها -->
        <div id="licensesContainer" class="space-y-6">
            <!-- تُعبأ ديناميكياً -->
        </div>
        <div id="emptyState" class="text-center py-12 text-gray-400 text-sm hidden">لا توجد أكواد مسجلة حتى الآن. أضف كوداً رئيسياً للبدء.</div>
    </div>

    <!-- نافذة منبثقة (مودال) لإضافة مستفيد لجهاز -->
    <div id="deviceModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 class="text-lg font-bold text-gray-800 mb-4">قيد جهاز جديد لهذا الكود</h3>
            <form onsubmit="saveDeviceAssignment(event)">
                <input type="hidden" id="modalKey">
                <div class="mb-4">
                    <label class="block text-xs font-medium text-gray-700 mb-1">اسم المستفيد / الجهة (جهاز من؟)</label>
                    <input type="text" id="assignOwner" required placeholder="مثال: الأخ محمد / مكتب الإدارة" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-medium text-gray-700 mb-1">تفاصيل الجهاز أو ملاحظة</label>
                    <input type="text" id="assignDevice" placeholder="مثال: جوال سامسونج S23 / لابتوب المكتب" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm transition">إلغاء</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm transition">حفظ القيد</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let licenses = JSON.parse(localStorage.getItem('ratib_multi_licenses')) || [];

        function saveMainLicense(e) {
            e.preventDefault();
            const key = document.getElementById('mainKey').value.trim();
            const maxDevices = parseInt(document.getElementById('maxDevices').value);
            const note = document.getElementById('note').value.trim();

            if (licenses.some(l => l.key === key)) {
                alert('هذا الكود موجود مسبقاً!');
                return;
            }

            licenses.unshift({
                key,
                maxDevices,
                note,
                date: new Date().toLocaleDateString('ar-SA'),
                devices: [] // قائمة الأجهزة المستفيدة من هذا الكود
            });

            localStorage.setItem('ratib_multi_licenses', JSON.stringify(licenses));
            document.getElementById('licenseForm').reset();
            document.getElementById('maxDevices').value = 1;
            renderApp();
        }

        function openModal(key) {
            const license = licenses.find(l => l.key === key);
            if (license.devices.length >= license.maxDevices) {
                alert('عذراً، هذا الكود استنفذ الحد الأقصى للأجهزة المسموحة!');
                return;
            }
            document.getElementById('modalKey').value = key;
            document.getElementById('assignOwner').value = '';
            document.getElementById('assignDevice').value = '';
            document.getElementById('deviceModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('deviceModal').classList.add('hidden');
        }

        function saveDeviceAssignment(e) {
            e.preventDefault();
            const key = document.getElementById('modalKey').value;
            const owner = document.getElementById('assignOwner').value.trim();
            const device = document.getElementById('assignDevice').value.trim();

            const license = licenses.find(l => l.key === key);
            if (license) {
                license.devices.push({
                    owner,
                    device,
                    assignedDate: new Date().toLocaleDateString('ar-SA')
                });
                localStorage.setItem('ratib_multi_licenses', JSON.stringify(licenses));
                closeModal();
                renderApp();
            }
        }

        function removeDevice(key, index) {
            if (confirm('هل تريد إزالة هذا القيد؟')) {
                const license = licenses.find(l => l.key === key);
                if (license) {
                    license.devices.splice(index, 1);
                    localStorage.setItem('ratib_multi_licenses', JSON.stringify(licenses));
                    renderApp();
                }
            }
        }

        function deleteMainLicense(key) {
            if (confirm('هل أنت متأكد من حذف هذا الكود الرئيسي وكل قيوده؟')) {
                licenses = licenses.filter(l => l.key !== key);
                localStorage.setItem('ratib_multi_licenses', JSON.stringify(licenses));
                renderApp();
            }
        }

        function renderApp() {
            const container = document.getElementById('licensesContainer');
            const emptyState = document.getElementById('emptyState');
            const search = document.getElementById('searchInput').value.toLowerCase();

            const filtered = licenses.filter(l => {
                const matchKey = l.key.toLowerCase().includes(search);
                const matchNote = l.note && l.note.toLowerCase().includes(search);
                const matchDevice = l.devices.some(d => d.owner.toLowerCase().includes(search) || (d.device && d.device.toLowerCase().includes(search)));
                return matchKey || matchNote || matchDevice;
            });

            container.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            filtered.forEach(item => {
                const usedCount = item.devices.length;
                const isFull = usedCount >= item.maxDevices;

                const card = document.createElement('div');
                card.className = "border rounded-2xl p-4 sm:p-5 bg-white shadow-sm hover:shadow transition";
                
                let devicesHtml = '';
                if (item.devices.length === 0) {
                    devicesHtml = `<p class="text-xs text-gray-400 italic py-2">لم يتم ربط أي جهاز بهذا الكود حتى الآن.</p>`;
                } else {
                    devicesHtml = `<div class="mt-3 space-y-2">`;
                    item.devices.forEach((d, idx) => {
                        devicesHtml += `
                            <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl text-xs sm:text-sm border">
                                <div>
                                    <span class="font-bold text-gray-800">${d.owner}</span>
                                    <span class="text-gray-500 mx-2">(${d.device || 'بدون تفاصيل جهاز'})</span>
                                    <span class="text-gray-400 text-[10px] block sm:inline">[تاريخ القيد: ${d.assignedDate}]</span>
                                </div>
                                <button onclick="removeDevice('${item.key}', ${idx})" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2 py-1 rounded-lg text-xs transition">إلغاء الربط</button>
                            </div>
                        `;
                    });
                    devicesHtml += `</div>`;
                }

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-mono font-bold text-base sm:text-lg text-emerald-800">${item.key}</span>
                                <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium">متاح: ${usedCount} / ${item.maxDevices} أجهزة</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">ملاحظة/المدة: ${item.note || '—'} | تاريخ الإضافة: ${item.date}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            <button onclick="openModal('${item.key}')" ${isFull ? 'disabled' : ''} class="${isFull ? 'bg-gray-300 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'} text-white px-3 py-1.5 rounded-xl text-xs font-medium transition">
                                ${isFull ? 'الكود مكتمل العدد' : '+ ربط جهاز جديد'}
                            </button>
                            <button onclick="deleteMainLicense('${item.key}')" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-1.5 rounded-xl text-xs transition" title="حذف الكود">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </div>
                    </div>
                    ${devicesHtml}
                `;
                container.appendChild(card);
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(licenses, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "ratib_multi_licenses_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        licenses = imported;
                        localStorage.setItem('ratib_multi_licenses', JSON.stringify(licenses));
                        renderApp();
                        alert('تم استيراد البيانات بنجاح!');
                    } else {
                        alert('ملف غير صالح.');
                    }
                } catch(err) {
                    alert('خطأ في قراءة الملف.');
                }
            };
            reader.readAsText(file);
        }

        renderApp();
    </script>
</body>
</html>
